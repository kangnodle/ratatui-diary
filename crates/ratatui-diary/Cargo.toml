[package]
  name    = "ratatui-diary"
  edition.workspace = true
  version.workspace = true

# Terminal presentation and composition root. Application policy lives inward.
[dependencies]
  chrono              = { workspace = true, features = ["clock"] }
  crossterm           = { workspace = true }
  ratatui             = { workspace = true }
  unicode-width       = { workspace = true }

  diary-application = { workspace = true }
  diary-domain      = { workspace = true }
  diary-runtime     = { workspace = true }
  diary-storage     = { workspace = true }
  markdown-render   = { workspace = true }
  org-render        = { workspace = true }

[dev-dependencies]
  tempfile = { workspace = true }
