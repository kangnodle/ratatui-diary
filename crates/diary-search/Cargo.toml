[package]
  name = "diary-search"
  edition.workspace = true
  version.workspace = true

[dependencies]
  chrono = { workspace = true }
  diary-domain = { workspace = true }
  diary-storage = { workspace = true }
  dirs = { workspace = true }
  regex = { workspace = true }
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  sha2 = "0.10.9"
  fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

[dev-dependencies]
  diary-application = { workspace = true }
  tempfile = { workspace = true }
