[workspace]
  members         = ["crates/*"]
  default-members = ["crates/ratatui-diary"]
  resolver        = "2"

[workspace.package]
  edition = "2024"
  version = "0.1.0"

[workspace.dependencies]
  chrono              = { version = "0.4.45", default-features = false, features = ["std"] }
  crossterm           = "0.29.0"
  dirs                = "7.0.0"
  ratatui             = "0.30.2"
  regex               = "1.13.1"
  strip-ansi-escapes  = "0.2.1"
  termimad            = "0.35.5"
  tempfile            = "3.27.0"
  unicode-width       = "0.2.2"

  diary-application = { path = "crates/diary-application" }
  diary-domain      = { path = "crates/diary-domain" }
  diary-runtime     = { path = "crates/diary-runtime" }
  diary-search      = { path = "crates/diary-search" }
  diary-storage     = { path = "crates/diary-storage" }
  markdown-render   = { path = "crates/markdown-render" }
  org-render        = { path = "crates/org-render" }
  text-editor       = { path = "crates/text-editor" }
